<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f4ea" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cde9d7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="pedestal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89d39d"/>
      <stop offset="100%" stop-color="#48a868"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad8eb"/>
      <stop offset="100%" stop-color="#4ea6c6"/>
    </linearGradient>
    <linearGradient id="recycleG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#53be6c"/>
      <stop offset="100%" stop-color="#1d7d44"/>
    </linearGradient>
  </defs>

  <!-- Soft background -->
  <rect width="560" height="220" rx="16" fill="url(#sky)" />
  <circle cx="145" cy="98" r="82" fill="#d7efe0" opacity="0.65" />
  <circle cx="420" cy="86" r="95" fill="#dff2e6" opacity="0.75" />

  <!-- Campus Building (Right) -->
  <g transform="translate(275, 22)">
    <!-- Ground shadow -->
    <ellipse cx="145" cy="176" rx="135" ry="12" fill="#b4dec2" opacity="0.7"/>
    <!-- Left wing -->
    <polygon points="10,70 105,36 105,165 10,165" fill="#f7fbf8" stroke="#c8ddd0" stroke-width="1.5"/>
    <polygon points="10,70 105,36 105,46 10,78" fill="#46a868"/>
    <!-- Windows left wing -->
    <g fill="url(#glass)" opacity="0.88">
      <polygon points="22,82 44,75 44,96 22,102"/>
      <polygon points="52,72 74,64 74,86 52,93"/>
      <polygon points="81,62 98,56 98,78 81,84"/>
      <polygon points="22,114 44,108 44,129 22,135"/>
      <polygon points="52,105 74,98 74,120 52,126"/>
      <polygon points="81,95 98,90 98,112 81,117"/>
    </g>
    <!-- Main facade -->
    <polygon points="105,36 250,58 250,165 105,165" fill="#ffffff" stroke="#c8ddd0" stroke-width="1.5"/>
    <polygon points="105,36 250,58 250,68 105,46" fill="#2c8d52"/>
    <!-- Glass rows -->
    <g fill="url(#glass)" opacity="0.9">
      <polygon points="118,58 148,63 148,88 118,84"/>
      <polygon points="156,64 186,69 186,94 156,90"/>
      <polygon points="194,70 224,75 224,99 194,95"/>
      <polygon points="118,96 148,100 148,125 118,122"/>
      <polygon points="156,101 186,105 186,130 156,126"/>
      <polygon points="194,106 224,110 224,134 194,131"/>
    </g>
    <!-- Entrance canopy -->
    <rect x="135" y="140" width="70" height="25" rx="3" fill="#226d42"/>
    <rect x="148" y="144" width="44" height="21" rx="2" fill="#7ec9e0"/>
    <!-- Campus Trees -->
    <g>
      <rect x="26" y="145" width="7" height="25" fill="#6b4f3a"/>
      <circle cx="30" cy="134" r="21" fill="#2f9153"/>
      <circle cx="19" cy="140" r="14" fill="#46ae6b"/>
      <circle cx="40" cy="138" r="13" fill="#257a44"/>
    </g>
    <g>
      <rect x="242" y="140" width="8" height="28" fill="#6b4f3a"/>
      <circle cx="246" cy="126" r="24" fill="#349a59"/>
      <circle cx="232" cy="133" r="15" fill="#4cb572"/>
      <circle cx="258" cy="132" r="14" fill="#257a44"/>
    </g>
  </g>

  <!-- Big Recycle Symbol behind E-Waste -->
  <g transform="translate(88, 12)" fill="url(#recycleG)" opacity="0.92">
    <path d="M58 6 L78 34 L64 38 C76 54, 83 70, 79 84 L55 76 C58 67, 54 55, 45 45 L33 50 Z"/>
    <path d="M108 86 L82 112 L75 99 C55 103, 39 101, 29 91 L46 72 C53 78, 66 79, 78 75 L71 63 Z"/>
    <path d="M8 82 L14 48 L28 54 C33 35, 44 21, 58 17 L64 41 C55 44, 48 54, 45 66 L58 72 Z" opacity="0.88"/>
  </g>

  <!-- Circular Green Pedestal -->
  <ellipse cx="145" cy="190" rx="115" ry="18" fill="#2b7e4c" opacity="0.3"/>
  <ellipse cx="145" cy="182" rx="110" ry="17" fill="url(#pedestal)"/>
  <ellipse cx="145" cy="177" rx="110" ry="15" fill="#a7e3b6"/>

  <!-- E-Waste Devices on Pedestal -->
  <!-- Monitor -->
  <g transform="translate(106, 62)">
    <rect x="0" y="0" width="90" height="62" rx="6" fill="#283834"/>
    <rect x="5" y="5" width="80" height="48" rx="3" fill="#3c544c"/>
    <rect x="37" y="62" width="16" height="12" fill="#283834"/>
    <rect x="26" y="72" width="38" height="5" rx="2" fill="#1d2a27"/>
    <!-- Leaf screen icon -->
    <path d="M45 40 C38 34, 38 22, 53 18 C54 31, 50 37, 45 40 Z" fill="#63d184"/>
  </g>

  <!-- Printer (Left foreground) -->
  <g transform="translate(54, 114)">
    <rect x="12" y="0" width="52" height="18" rx="3" fill="#c7d5cd"/>
    <rect x="0" y="14" width="76" height="36" rx="6" fill="#3c4c47"/>
    <rect x="8" y="21" width="60" height="8" rx="2" fill="#222d2a"/>
    <rect x="16" y="37" width="44" height="18" rx="2" fill="#edf4ef"/>
    <circle cx="63" cy="25" r="2.5" fill="#4ade80"/>
  </g>

  <!-- Battery (Center-right) -->
  <g transform="translate(160, 108)">
    <rect x="12" y="0" width="14" height="5" rx="2" fill="#9fb2a7"/>
    <rect x="4" y="5" width="30" height="54" rx="5" fill="#243530"/>
    <rect x="8" y="11" width="22" height="42" rx="3" fill="#206f44"/>
    <path d="M19 21 L14 33 L20 33 L18 44 L25 30 L19 30 Z" fill="#86efac"/>
  </g>

  <!-- Network Router (Right foreground) -->
  <g transform="translate(188, 146)">
    <rect x="10" y="-18" width="4" height="20" rx="2" fill="#253430"/>
    <rect x="46" y="-18" width="4" height="20" rx="2" fill="#253430"/>
    <rect x="0" y="0" width="60" height="20" rx="5" fill="#23322e"/>
    <circle cx="12" cy="10" r="2.5" fill="#4ade80"/>
    <circle cx="22" cy="10" r="2.5" fill="#4ade80"/>
    <circle cx="32" cy="10" r="2.5" fill="#fbbf24"/>
  </g>
</svg>

